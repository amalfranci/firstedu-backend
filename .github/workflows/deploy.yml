name: Deploy FirstEdu Backendd

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Copy files to EC2
      - name: Copy Project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "./*"
          target: "/home/ubuntu/firstedu-backend"

      # Deploy application
      - name: Deploy & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/firstedu-backend
            cd /home/ubuntu/firstedu-backend

            echo "Current files:"
            ls -la

            echo "${{ secrets.ENV_FILE }}" > .env

            # Paper jobs write under temp/; keep dirs so worker can claim/persist.
            mkdir -p temp/paper-jobs temp/generation-jobs temp/confirmed-questions

            npm install

            # API process (enqueues paper jobs when PAPER_JOB_RUNNER=worker)
            if pm2 describe backend > /dev/null; then
              pm2 restart backend --update-env
            else
              pm2 start src/server.js --name backend
            fi

            # Dedicated paper worker — required when PAPER_JOB_RUNNER=worker
            # (API alone will leave jobs stuck in pending forever).
            if pm2 describe paper-worker > /dev/null; then
              pm2 restart paper-worker --update-env
            else
              pm2 start scripts/paper-job-worker.mjs --name paper-worker
            fi

            pm2 save
            pm2 status

            sudo systemctl restart nginx

            echo "Deployment completed successfully"
